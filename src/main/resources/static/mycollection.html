<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Collection | BibConnect</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-navbar"></div>

  <main class="page-shell">
    <div class="container">
      <section class="card content-card mb-4">
        <div class="card-body p-4">
          <h1 class="h3 page-title mb-2">My Collection</h1>
          <p class="list-summary mb-0" id="collectionSummary">Loading your saved publications...</p>
        </div>
      </section>

      <div id="alertBox" class="mb-3"></div>
      <section id="collectionList" class="row row-cols-1 row-cols-lg-2 g-4"></section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/mycollection.js"></script>
</body>
</html>
