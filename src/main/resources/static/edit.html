<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Publication | BibConnect</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-navbar"></div>

  <main class="page-shell">
    <div class="container">
      <section class="card content-card">
        <div class="card-body p-4 p-lg-5">
          <div class="mb-4">
            <h1 class="h3 page-title mb-2" id="pageHeading">Add publication</h1>
            <p class="text-muted mb-0" id="pageLead">Create a new publication record with core bibliographic metadata.</p>
          </div>

          <div id="alertBox" class="mb-3"></div>

          <form id="publicationForm" novalidate>
            <div class="form-section-title">Core information</div>
            <div class="row g-3 mb-4">
              <div class="col-12">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
              </div>
              <div class="col-12">
                <label for="authors" class="form-label">Authors</label>
                <input type="text" class="form-control" id="authors" name="authors" placeholder="Alice Smith, Bob Lee" required>
              </div>
              <div class="col-md-4">
                <label for="year" class="form-label">Year</label>
                <input type="number" class="form-control" id="year" name="year" min="1900" max="2100">
              </div>
              <div class="col-md-8">
                <label for="venue" class="form-label">Venue / Journal / Conference</label>
                <input type="text" class="form-control" id="venue" name="venue">
              </div>
            </div>

            <div class="form-section-title">Identifiers and links</div>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="doi" class="form-label">DOI</label>
                <input type="text" class="form-control" id="doi" name="doi">
              </div>
              <div class="col-md-6">
                <label for="url" class="form-label">External URL</label>
                <input type="url" class="form-control" id="url" name="url" placeholder="https://">
              </div>
            </div>

            <div class="form-section-title">Content and categorization</div>
            <div class="row g-3 mb-4">
              <div class="col-12">
                <label for="tags" class="form-label">Tags</label>
                <input type="text" class="form-control" id="tags" name="tags" placeholder="database, java, distributed systems">
              </div>
              <div class="col-12">
                <label for="abstract" class="form-label">Abstract</label>
                <textarea class="form-control" id="abstract" name="abstract" rows="7"></textarea>
              </div>
            </div>

            <div class="d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-primary" id="submitButton">Create Publication</button>
              <a class="btn btn-outline-secondary" href="index.html">Cancel</a>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
